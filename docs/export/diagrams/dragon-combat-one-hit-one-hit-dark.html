<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>한 타격 end-to-end</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 48px 32px; background: #2d3142; color: #f5f5f5; font-family: 'Geist', 'Noto Sans KR', system-ui, sans-serif; }
    .frame { width: 100%; max-width: 1280px; }
    .eyebrow { margin-bottom: 8px; color: #bfc0c0; font: 500 8px 'Geist Mono', monospace; letter-spacing: 0.14em; text-transform: uppercase; }
    h1 { margin-bottom: 24px; font: 400 40px/1.15 'Instrument Serif', serif; }
    svg { display: block; width: 100%; }
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">Architecture · Combat · slide-16x9</p>
    <h1>한 타격 end-to-end</h1>
    <svg viewBox="0 0 1280 720" role="img" aria-labelledby="onehit-title onehit-desc" xmlns="http://www.w3.org/2000/svg">
      <title id="onehit-title">스킬·버프·패시브가 한 타격으로 모이는 지도</title>
      <desc id="onehit-desc">시리즈 2 트리거가 Activate·적용으로 들어가고, 시리즈 1 적용 척추를 지나 Vital로 모인 뒤 패시브로 연쇄될 수 있습니다.</desc>
      <defs>
        <marker id="oh-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker>
        <marker id="oh-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker>
      </defs>
      <rect width="1280" height="720" fill="#2d3142"/>

      <!-- Zones -->
      <rect x="40" y="96" width="280" height="440" rx="8" fill="rgba(245,245,245,0.02)" stroke="rgba(245,245,245,0.28)"/>
      <rect x="56" y="88" width="136" height="18" fill="#2d3142"/>
      <text x="64" y="102" fill="#bfc0c0" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">시리즈 2 — 트리거</text>

      <rect x="360" y="96" width="860" height="440" rx="8" fill="rgba(240,138,89,0.05)" stroke="#f08a59"/>
      <rect x="376" y="88" width="128" height="18" fill="#2d3142"/>
      <text x="384" y="102" fill="#f08a59" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">시리즈 1 — 적용</text>

      <!-- Connectors (behind nodes) -->
      <!-- SK/BF/PS → ACT -->
      <path d="M320,168 H400" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#oh-arrow)"/>
      <path d="M320,280 H380 V200 H400" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#oh-arrow)"/>
      <path d="M320,400 H380 V200 H400" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#oh-arrow)"/>
      <!-- PS → BF -->
      <path d="M180,360 V320" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#oh-arrow)"/>
      <!-- BF → APP (path B) -->
      <path d="M180,320 V500 H1040 V256" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#oh-arrow)"/>
      <!-- ACT → FORM → APP → VIT -->
      <path d="M560,200 H620" fill="none" stroke="#f08a59" stroke-width="1.4" marker-end="url(#oh-arrow-accent)"/>
      <path d="M860,200 H920" fill="none" stroke="#f08a59" stroke-width="1.4" marker-end="url(#oh-arrow-accent)"/>
      <path d="M1040,256 V380" fill="none" stroke="#f08a59" stroke-width="1.4" marker-end="url(#oh-arrow-accent)"/>
      <!-- VIT → PS cascade -->
      <path d="M920,416 H180 V432" fill="none" stroke="#bfc0c0" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#oh-arrow)"/>
      <!-- PJ → FORM -->
      <path d="M740,320 V256" fill="none" stroke="#bfc0c0" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#oh-arrow)"/>

      <!-- S2: SK BF PS -->
      <rect x="70" y="128" width="220" height="80" rx="6" fill="#393e53" stroke="#f5f5f5"/>
      <text x="180" y="160" fill="#f5f5f5" font-size="16" font-weight="600" font-family="'Geist','Noto Sans KR',sans-serif" text-anchor="middle">스킬</text>
      <text x="180" y="184" fill="#bfc0c0" font-size="12" font-family="'Geist Mono',monospace" text-anchor="middle">TryCast · 애니</text>

      <rect x="70" y="240" width="220" height="80" rx="6" fill="#393e53" stroke="#f5f5f5"/>
      <text x="180" y="272" fill="#f5f5f5" font-size="16" font-weight="600" font-family="'Geist','Noto Sans KR',sans-serif" text-anchor="middle">버프</text>
      <text x="180" y="296" fill="#bfc0c0" font-size="12" font-family="'Geist Mono',monospace" text-anchor="middle">Add · OnTrigger</text>

      <rect x="70" y="360" width="220" height="80" rx="6" fill="#393e53" stroke="#f5f5f5"/>
      <text x="180" y="392" fill="#f5f5f5" font-size="16" font-weight="600" font-family="'Geist','Noto Sans KR',sans-serif" text-anchor="middle">패시브</text>
      <text x="180" y="416" fill="#bfc0c0" font-size="12" font-family="'Geist Mono',monospace" text-anchor="middle">queue · Effect</text>

      <!-- S1: ACT FORM APP VIT PJ -->
      <rect x="400" y="144" width="160" height="112" rx="6" fill="rgba(240,138,89,0.12)" stroke="#f08a59"/>
      <text x="480" y="188" fill="#f5f5f5" font-size="16" font-weight="600" font-family="'Geist Mono',monospace" text-anchor="middle">Activate</text>
      <text x="480" y="216" fill="#bfc0c0" font-size="12" font-family="'Noto Sans KR',sans-serif" text-anchor="middle">타격 시작</text>

      <rect x="620" y="144" width="240" height="112" rx="6" fill="#393e53" stroke="#f5f5f5"/>
      <text x="740" y="184" fill="#f5f5f5" font-size="15" font-weight="600" font-family="'Geist Mono',monospace" text-anchor="middle">Target · Area</text>
      <text x="740" y="208" fill="#f5f5f5" font-size="15" font-weight="600" font-family="'Geist Mono',monospace" text-anchor="middle">· Projectile</text>
      <text x="740" y="232" fill="#bfc0c0" font-size="12" font-family="'Noto Sans KR',sans-serif" text-anchor="middle">대상 확정</text>

      <rect x="920" y="144" width="240" height="112" rx="6" fill="rgba(240,138,89,0.12)" stroke="#f08a59"/>
      <text x="1040" y="188" fill="#f5f5f5" font-size="16" font-weight="600" font-family="'Geist','Noto Sans KR',sans-serif" text-anchor="middle">적용</text>
      <text x="1040" y="216" fill="#bfc0c0" font-size="12" font-family="'Geist Mono',monospace" text-anchor="middle">DamageCalculator</text>

      <rect x="920" y="380" width="240" height="72" rx="6" fill="rgba(240,138,89,0.12)" stroke="#f08a59"/>
      <text x="1040" y="412" fill="#f5f5f5" font-size="16" font-weight="600" font-family="'Geist Mono',monospace" text-anchor="middle">Vital</text>
      <text x="1040" y="436" fill="#bfc0c0" font-size="12" font-family="'Noto Sans KR',sans-serif" text-anchor="middle">HP · 가드</text>

      <rect x="620" y="320" width="240" height="56" rx="6" fill="rgba(245,245,245,0.03)" stroke="rgba(245,245,245,0.30)" stroke-dasharray="4,4"/>
      <text x="740" y="354" fill="#bfc0c0" font-size="14" font-weight="600" font-family="'Geist Mono',monospace" text-anchor="middle">Projectile transport</text>

      <line x1="40" y1="632" x2="1240" y2="632" stroke="rgba(245,245,245,0.10)" stroke-width="0.8"/>
      <text x="40" y="656" fill="#bfc0c0" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">LEGEND</text>
      <rect x="128" y="644" width="16" height="12" rx="2" fill="rgba(240,138,89,0.12)" stroke="#f08a59"/>
      <text x="152" y="656" fill="#bfc0c0" font-size="8" font-family="'Geist Mono',monospace">APPLY SPINE</text>
      <line x1="300" y1="650" x2="332" y2="650" stroke="#bfc0c0" stroke-width="1.2" stroke-dasharray="5,4"/>
      <text x="344" y="656" fill="#bfc0c0" font-size="8" font-family="'Geist Mono',monospace">CASCADE / TRANSPORT</text>
    </svg>
  </main>
</body>
</html>
