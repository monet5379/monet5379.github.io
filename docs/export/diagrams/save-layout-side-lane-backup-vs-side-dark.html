<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>세이브 레이아웃 — Backup/과 사이드</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 48px 32px; background: #2d3142; color: #f5f5f5; font-family: 'Geist', 'Noto Sans KR', system-ui, sans-serif; }
    .frame { width: 100%; max-width: 1280px; }
    .eyebrow { margin-bottom: 8px; color: #bfc0c0; font: 500 8px 'Geist Mono', monospace; letter-spacing: 0.14em; text-transform: uppercase; }
    h1 { margin-bottom: 24px; font: 400 40px/1.15 'Instrument Serif', serif; }
    svg { display: block; width: 100%; }
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">Architecture · Save Layout · slide-16x9</p>
    <h1>Backup/과 사이드</h1>
    <svg viewBox="0 0 1280 720" role="img" aria-labelledby="backup-side-title backup-side-desc" xmlns="http://www.w3.org/2000/svg">
      <title id="backup-side-title">Backup/과 사이드 레인 대비</title>
      <desc id="backup-side-desc">손상·빈 파일은 Backup/ 실패 레인으로, 타이틀 안전 지점은 사이드 의도 레인으로 갈립니다.</desc>
      <defs>
        <marker id="bs-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker>
        <marker id="bs-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker>
      </defs>
      <rect width="1280" height="720" fill="#2d3142"/>

      <!-- Sources -->
      <rect x="80" y="200" width="240" height="88" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
      <text x="200" y="236" fill="#f5f5f5" font-size="16" font-weight="600" font-family="'Geist','Noto Sans KR',sans-serif" text-anchor="middle">손상 · 빈 파일</text>
      <text x="200" y="260" fill="#bfc0c0" font-size="12" font-family="'Noto Sans KR',sans-serif" text-anchor="middle">실패 경로</text>

      <rect x="80" y="400" width="240" height="88" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
      <text x="200" y="436" fill="#f5f5f5" font-size="16" font-weight="600" font-family="'Geist','Noto Sans KR',sans-serif" text-anchor="middle">타이틀 안전 지점</text>
      <text x="200" y="460" fill="#bfc0c0" font-size="12" font-family="'Noto Sans KR',sans-serif" text-anchor="middle">세션 · 오토</text>

      <!-- Connectors -->
      <path d="M320,244 H400" fill="none" stroke="#bfc0c0" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#bs-arrow)"/>
      <path d="M320,444 H400" fill="none" stroke="#f08a59" stroke-width="1.4" marker-end="url(#bs-arrow-accent)"/>

      <!-- Backup zone (dashed) -->
      <rect x="400" y="136" width="760" height="200" rx="8" fill="rgba(245,245,245,0.02)" stroke="rgba(245,245,245,0.30)" stroke-width="1" stroke-dasharray="4,4"/>
      <rect x="416" y="128" width="168" height="18" fill="#2d3142"/>
      <text x="424" y="142" fill="#bfc0c0" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">BACKUP/ — 로컬 실패</text>
      <rect x="480" y="192" width="600" height="88" rx="6" fill="rgba(245,245,245,0.03)" stroke="rgba(245,245,245,0.30)" stroke-width="1" stroke-dasharray="4,4"/>
      <text x="780" y="228" fill="#f5f5f5" font-size="16" font-weight="600" font-family="'Geist','Noto Sans KR',sans-serif" text-anchor="middle">타임스탬프 복사 → 없음 처리</text>
      <text x="780" y="252" fill="#bfc0c0" font-size="12" font-family="'Noto Sans KR',sans-serif" text-anchor="middle">Continue 정본 아님 · 관측·수동 복구</text>

      <!-- Side zone (focal) -->
      <rect x="400" y="360" width="760" height="200" rx="8" fill="rgba(240,138,89,0.06)" stroke="#f08a59" stroke-width="1"/>
      <rect x="416" y="352" width="128" height="18" fill="#2d3142"/>
      <text x="424" y="366" fill="#f08a59" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">사이드 — 의도적 레인</text>
      <rect x="480" y="416" width="600" height="88" rx="6" fill="rgba(240,138,89,0.12)" stroke="#f08a59" stroke-width="1"/>
      <text x="780" y="452" fill="#f5f5f5" font-size="16" font-weight="600" font-family="'Geist','Noto Sans KR',sans-serif" text-anchor="middle">SaveSide · valid 힌트</text>
      <text x="780" y="476" fill="#bfc0c0" font-size="12" font-family="'Noto Sans KR',sans-serif" text-anchor="middle">의도한 옆 진행 · InvalidateSide</text>

      <line x1="40" y1="632" x2="1240" y2="632" stroke="rgba(245,245,245,0.10)" stroke-width="0.8"/>
      <text x="40" y="656" fill="#bfc0c0" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">LEGEND</text>
      <rect x="128" y="644" width="16" height="12" rx="2" fill="rgba(240,138,89,0.12)" stroke="#f08a59"/>
      <text x="152" y="656" fill="#bfc0c0" font-size="8" font-family="'Geist Mono',monospace">FOCAL SIDE</text>
      <line x1="280" y1="650" x2="312" y2="650" stroke="#bfc0c0" stroke-width="1.2" stroke-dasharray="5,4"/>
      <text x="324" y="656" fill="#bfc0c0" font-size="8" font-family="'Geist Mono',monospace">FAILURE</text>
      <line x1="420" y1="650" x2="452" y2="650" stroke="#f08a59" stroke-width="1.4"/>
      <text x="464" y="656" fill="#bfc0c0" font-size="8" font-family="'Geist Mono',monospace">INTENTIONAL</text>
    </svg>
  </main>
</body>
</html>
