<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>세션 ≠ 버프 표면</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 48px 32px; background: #2d3142; color: #f5f5f5; font-family: 'Geist', 'Noto Sans KR', system-ui, sans-serif; }
    .frame { width: 100%; max-width: 1280px; }
    .eyebrow { margin-bottom: 8px; color: #bfc0c0; font: 500 8px 'Geist Mono', monospace; letter-spacing: 0.14em; text-transform: uppercase; }
    h1 { margin-bottom: 24px; font: 400 40px/1.15 'Instrument Serif', serif; }
    svg { display: block; width: 100%; }
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">Architecture · Blade Assault · slide-16x9</p>
    <h1>세션과 버프 표면</h1>
    <svg viewBox="0 0 1280 720" role="img" aria-labelledby="session-title session-desc" xmlns="http://www.w3.org/2000/svg">
      <title id="session-title">런·스테이지·메타 세션이 버프 표면으로 모이는 구조</title>
      <desc id="session-desc">코어·기어·개조는 런 세션, 리스크는 스테이지 위험, 특성·부활은 캐릭터 메타로 갈라진 뒤 버프·패시브 반영으로만 모입니다.</desc>
      <defs>
        <marker id="ss-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker>
        <marker id="ss-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker>
      </defs>
      <rect width="1280" height="720" fill="#2d3142"/>

      <!-- Sources -->
      <rect x="60" y="140" width="240" height="80" rx="6" fill="#393e53" stroke="#f5f5f5"/>
      <text x="180" y="172" fill="#f5f5f5" font-size="16" font-weight="600" font-family="'Geist','Noto Sans KR',sans-serif" text-anchor="middle">코어 · 기어 · 개조</text>
      <text x="180" y="196" fill="#bfc0c0" font-size="12" font-family="'Noto Sans KR',sans-serif" text-anchor="middle">런 장착</text>

      <rect x="60" y="300" width="240" height="80" rx="6" fill="#393e53" stroke="#f5f5f5"/>
      <text x="180" y="332" fill="#f5f5f5" font-size="16" font-weight="600" font-family="'Geist','Noto Sans KR',sans-serif" text-anchor="middle">리스크</text>
      <text x="180" y="356" fill="#bfc0c0" font-size="12" font-family="'Noto Sans KR',sans-serif" text-anchor="middle">이번 런 위험</text>

      <rect x="60" y="460" width="240" height="80" rx="6" fill="#393e53" stroke="#f5f5f5"/>
      <text x="180" y="492" fill="#f5f5f5" font-size="16" font-weight="600" font-family="'Geist','Noto Sans KR',sans-serif" text-anchor="middle">특성 · 부활</text>
      <text x="180" y="516" fill="#bfc0c0" font-size="12" font-family="'Noto Sans KR',sans-serif" text-anchor="middle">캐릭터 정체성</text>

      <!-- Connectors source → session -->
      <path d="M300,180 H380" fill="none" stroke="#f08a59" stroke-width="1.4" marker-end="url(#ss-arrow-accent)"/>
      <path d="M300,340 H380" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#ss-arrow)"/>
      <path d="M300,500 H380" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#ss-arrow)"/>

      <!-- Sessions -->
      <rect x="380" y="128" width="320" height="104" rx="6" fill="rgba(240,138,89,0.12)" stroke="#f08a59"/>
      <text x="540" y="172" fill="#f5f5f5" font-size="16" font-weight="600" font-family="'Geist','Noto Sans KR',sans-serif" text-anchor="middle">런 세션</text>
      <text x="540" y="200" fill="#bfc0c0" font-size="12" font-family="'Noto Sans KR',sans-serif" text-anchor="middle">보유 · 재생 · 사망 뒤 지움</text>

      <rect x="380" y="288" width="320" height="104" rx="6" fill="#393e53" stroke="#f5f5f5"/>
      <text x="540" y="332" fill="#f5f5f5" font-size="16" font-weight="600" font-family="'Geist','Noto Sans KR',sans-serif" text-anchor="middle">스테이지 · 런 위험</text>
      <text x="540" y="360" fill="#bfc0c0" font-size="12" font-family="'Noto Sans KR',sans-serif" text-anchor="middle">덱 · 스테이지 종료 경계</text>

      <rect x="380" y="448" width="320" height="104" rx="6" fill="#393e53" stroke="#f5f5f5"/>
      <text x="540" y="492" fill="#f5f5f5" font-size="16" font-weight="600" font-family="'Geist','Noto Sans KR',sans-serif" text-anchor="middle">캐릭터 메타</text>
      <text x="540" y="520" fill="#bfc0c0" font-size="12" font-family="'Noto Sans KR',sans-serif" text-anchor="middle">프리셋 · 해금 · 부활 충전</text>

      <!-- Session → BP -->
      <path d="M700,180 H780 V340" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#ss-arrow)"/>
      <path d="M700,340 H780" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#ss-arrow)"/>
      <path d="M700,500 H780 V340" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#ss-arrow)"/>

      <!-- Buff surface -->
      <rect x="780" y="280" width="400" height="120" rx="6" fill="#393e53" stroke="#f5f5f5"/>
      <text x="980" y="328" fill="#f5f5f5" font-size="16" font-weight="600" font-family="'Geist','Noto Sans KR',sans-serif" text-anchor="middle">버프 · 패시브 반영</text>
      <text x="980" y="356" fill="#bfc0c0" font-size="12" font-family="'Noto Sans KR',sans-serif" text-anchor="middle">전투 표면 · 세션 계약은 여기 없음</text>

      <line x1="40" y1="632" x2="1240" y2="632" stroke="rgba(245,245,245,0.10)" stroke-width="0.8"/>
      <text x="40" y="656" fill="#bfc0c0" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">LEGEND</text>
      <rect x="128" y="644" width="16" height="12" rx="2" fill="rgba(240,138,89,0.12)" stroke="#f08a59"/>
      <text x="152" y="656" fill="#bfc0c0" font-size="8" font-family="'Geist Mono',monospace">FOCAL RUN SESSION</text>
      <line x1="360" y1="650" x2="392" y2="650" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#ss-arrow)"/>
      <text x="404" y="656" fill="#bfc0c0" font-size="8" font-family="'Geist Mono',monospace">FAN-IN TO SURFACE</text>
    </svg>
  </main>
</body>
</html>
