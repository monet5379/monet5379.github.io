<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Excel → JSON 고정 데이터 파이프</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 48px 32px; background: #2d3142; color: #f5f5f5; font-family: 'Geist', 'Noto Sans KR', system-ui, sans-serif; }
    .frame { width: 100%; max-width: 1280px; }
    .eyebrow { margin-bottom: 8px; color: #bfc0c0; font: 500 8px 'Geist Mono', monospace; letter-spacing: 0.14em; text-transform: uppercase; }
    h1 { margin-bottom: 24px; font: 400 40px/1.15 'Instrument Serif', serif; }
    svg { display: block; width: 100%; }
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">Data flow · Fixed Data · slide-16x9</p>
    <h1>에디터에서 굳히고, 런타임은 JSON만</h1>
    <svg viewBox="0 0 1280 720" role="img" aria-labelledby="excel-title excel-desc" xmlns="http://www.w3.org/2000/svg">
      <title id="excel-title">Excel을 JSON으로 굳히는 고정 데이터 파이프</title>
      <desc id="excel-desc">에디터에서 시트를 JSON으로 변환하고, 런타임은 Load·Parse·FindClone으로만 읽습니다. Scriptable 경로는 도식 밖입니다.</desc>
      <defs>
        <marker id="ex-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker>
        <marker id="ex-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker>
      </defs>
      <rect width="1280" height="720" fill="#2d3142"/>

      <!-- EDITOR zone -->
      <rect x="60" y="120" width="560" height="400" rx="8" fill="rgba(245,245,245,0.02)" stroke="rgba(245,245,245,0.28)" stroke-width="1"/>
      <rect x="76" y="112" width="80" height="18" fill="#2d3142"/>
      <text x="84" y="126" fill="#bfc0c0" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">EDITOR</text>

      <rect x="120" y="180" width="200" height="80" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
      <text x="220" y="214" fill="#f5f5f5" font-size="16" font-weight="600" font-family="'Geist Mono',monospace" text-anchor="middle">Sheet/*.xlsx</text>
      <text x="220" y="238" fill="#bfc0c0" font-size="12" font-family="'Noto Sans KR',sans-serif" text-anchor="middle">기획 시트</text>

      <path d="M320,220 H360" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#ex-arrow)"/>

      <rect x="360" y="180" width="200" height="80" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
      <text x="460" y="214" fill="#f5f5f5" font-size="16" font-weight="600" font-family="'Geist','Noto Sans KR',sans-serif" text-anchor="middle">Excel4Unity</text>
      <text x="460" y="238" fill="#bfc0c0" font-size="12" font-family="'Noto Sans KR',sans-serif" text-anchor="middle">변환 메뉴</text>

      <path d="M460,260 V300" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#ex-arrow)"/>

      <rect x="360" y="300" width="200" height="80" rx="6" fill="rgba(240,138,89,0.12)" stroke="#f08a59" stroke-width="1"/>
      <text x="460" y="334" fill="#f5f5f5" font-size="14" font-weight="600" font-family="'Geist Mono',monospace" text-anchor="middle">Resources/Data</text>
      <text x="460" y="358" fill="#bfc0c0" font-size="12" font-family="'Geist Mono',monospace" text-anchor="middle">*.json</text>

      <text x="340" y="460" fill="#8e98ac" font-size="12" font-family="'Noto Sans KR',sans-serif" text-anchor="middle">빌드에 굳힘 · 플레이어는 xlsx 없음</text>

      <!-- Bridge EDITOR → RUNTIME -->
      <path d="M620,340 H700" fill="none" stroke="#f08a59" stroke-width="1.4" marker-end="url(#ex-arrow-accent)"/>

      <!-- RUNTIME zone -->
      <rect x="700" y="120" width="520" height="400" rx="8" fill="rgba(240,138,89,0.05)" stroke="#f08a59" stroke-width="1"/>
      <rect x="716" y="112" width="88" height="18" fill="#2d3142"/>
      <text x="724" y="126" fill="#f08a59" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">RUNTIME</text>

      <rect x="780" y="180" width="360" height="64" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
      <text x="960" y="218" fill="#f5f5f5" font-size="16" font-weight="600" font-family="'Geist Mono',monospace" text-anchor="middle">JsonDataManager.Load</text>

      <path d="M960,244 V276" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#ex-arrow)"/>

      <rect x="780" y="276" width="360" height="64" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
      <text x="960" y="314" fill="#f5f5f5" font-size="16" font-weight="600" font-family="'Geist Mono',monospace" text-anchor="middle">ParseData</text>

      <path d="M960,340 V372" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#ex-arrow)"/>

      <rect x="780" y="372" width="360" height="64" rx="6" fill="rgba(240,138,89,0.12)" stroke="#f08a59" stroke-width="1"/>
      <text x="960" y="410" fill="#f5f5f5" font-size="16" font-weight="600" font-family="'Geist Mono',monospace" text-anchor="middle">Find*Clone</text>

      <text x="960" y="480" fill="#8e98ac" font-size="12" font-family="'Noto Sans KR',sans-serif" text-anchor="middle">타입드 조회 · 게임플레이는 복제본만</text>

      <line x1="40" y1="632" x2="1240" y2="632" stroke="rgba(245,245,245,0.10)" stroke-width="0.8"/>
      <text x="40" y="656" fill="#bfc0c0" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">LEGEND</text>
      <rect x="128" y="644" width="16" height="12" rx="2" fill="rgba(240,138,89,0.12)" stroke="#f08a59"/>
      <text x="152" y="656" fill="#bfc0c0" font-size="8" font-family="'Geist Mono',monospace">FOCAL JSON / CLONE</text>
      <line x1="360" y1="650" x2="392" y2="650" stroke="#f08a59" stroke-width="1.4" marker-end="url(#ex-arrow-accent)"/>
      <text x="404" y="656" fill="#bfc0c0" font-size="8" font-family="'Geist Mono',monospace">HAND-OFF</text>
      <text x="520" y="656" fill="#8e98ac" font-size="8" font-family="'Geist Mono',monospace">SCRIPTABLE OUT OF SCOPE</text>
    </svg>
  </main>
</body>
</html>
