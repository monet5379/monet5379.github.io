<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>드래곤 이즈 데드 — 복구 로드 순서</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 48px 32px; background: #2d3142; color: #f5f5f5; font-family: 'Geist', 'Noto Sans KR', system-ui, sans-serif; }
    .frame { width: 100%; max-width: 1280px; }
    .eyebrow { margin-bottom: 8px; color: #bfc0c0; font: 500 8px 'Geist Mono', monospace; letter-spacing: 0.14em; text-transform: uppercase; }
    h1 { margin-bottom: 24px; font: 400 40px/1.15 'Instrument Serif', serif; }
    svg { display: block; width: 100%; }
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">Flowchart · Dragon Is Dead · slide-16x9</p>
    <h1>복구 로드 순서</h1>
    <svg viewBox="0 0 1280 720" role="img" aria-labelledby="recovery-title recovery-desc" xmlns="http://www.w3.org/2000/svg">
      <title id="recovery-title">드래곤 이즈 데드 복구 로드 순서</title>
      <desc id="recovery-desc">메인 슬롯, 필수 세이브, 실패 백업을 순서로 시도하고 모두 실패하면 기본 데이터를 만든 뒤 진행 데이터에 연결합니다.</desc>
      <defs>
        <marker id="rc-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker>
        <marker id="rc-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker>
      </defs>
      <rect width="1280" height="720" fill="#2d3142"/>

      <!-- Connectors -->
      <path d="M200,88 V104" fill="none" stroke="#f08a59" stroke-width="1.4" marker-end="url(#rc-arrow-accent)"/>
      <path d="M200,160 V176" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#rc-arrow)"/>
      <path d="M200,232 V248" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#rc-arrow)"/>
      <text x="216" y="244" fill="#bfc0c0" font-size="12" font-family="'Geist Mono',monospace">실패</text>
      <path d="M200,296 V312" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#rc-arrow)"/>
      <path d="M200,368 V384" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#rc-arrow)"/>
      <text x="216" y="380" fill="#bfc0c0" font-size="12" font-family="'Geist Mono',monospace">실패</text>
      <path d="M200,440 V456" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#rc-arrow)"/>
      <path d="M200,512 V528" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#rc-arrow)"/>
      <text x="216" y="524" fill="#bfc0c0" font-size="12" font-family="'Geist Mono',monospace">실패</text>

      <!-- Success → ONLOAD (separate elbows, no shared trunk) -->
      <path d="M248,204 H560 V300 H860" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#rc-arrow)"/>
      <text x="380" y="196" fill="#bfc0c0" font-size="12" font-family="'Geist Mono',monospace">성공</text>
      <path d="M248,340 H600 V330 H860" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#rc-arrow)"/>
      <text x="400" y="332" fill="#bfc0c0" font-size="12" font-family="'Geist Mono',monospace">성공</text>
      <path d="M248,484 H640 V360 H860" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#rc-arrow)"/>
      <text x="420" y="476" fill="#bfc0c0" font-size="12" font-family="'Geist Mono',monospace">성공</text>
      <path d="M320,556 H680 V390 H860" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#rc-arrow)"/>

      <!-- Start -->
      <rect x="100" y="40" width="200" height="48" rx="20" fill="rgba(240,138,89,0.12)" stroke="#f08a59" stroke-width="1"/>
      <text x="200" y="70" fill="#f5f5f5" font-size="16" font-weight="600" font-family="'Geist','Noto Sans KR',sans-serif" text-anchor="middle">복구 로드</text>

      <!-- ① -->
      <rect x="80" y="104" width="240" height="56" rx="6" fill="rgba(240,138,89,0.12)" stroke="#f08a59" stroke-width="1"/>
      <text x="200" y="128" fill="#f5f5f5" font-size="16" font-weight="600" font-family="'Geist','Noto Sans KR',sans-serif" text-anchor="middle">① 메인 슬롯 ×3</text>
      <text x="200" y="148" fill="#bfc0c0" font-size="12" font-family="'Noto Sans KR',sans-serif" text-anchor="middle">시퀀스 · 시각 비교</text>

      <!-- D1 -->
      <path d="M200,176 L248,204 L200,232 L152,204 Z" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
      <text x="200" y="208" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist','Noto Sans KR',sans-serif" text-anchor="middle">성공?</text>

      <!-- ② -->
      <rect x="80" y="248" width="240" height="48" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
      <text x="200" y="278" fill="#f5f5f5" font-size="16" font-weight="600" font-family="'Geist','Noto Sans KR',sans-serif" text-anchor="middle">② 필수 세이브 ×3</text>

      <!-- D2 -->
      <path d="M200,312 L248,340 L200,368 L152,340 Z" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
      <text x="200" y="344" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist','Noto Sans KR',sans-serif" text-anchor="middle">성공?</text>

      <!-- ③ -->
      <rect x="80" y="384" width="240" height="56" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
      <text x="200" y="408" fill="#f5f5f5" font-size="14" font-weight="600" font-family="'Geist','Noto Sans KR',sans-serif" text-anchor="middle">③ 타임스탬프 실패 백업</text>
      <text x="200" y="428" fill="#bfc0c0" font-size="12" font-family="'Noto Sans KR',sans-serif" text-anchor="middle">Continue 정본 아님</text>

      <!-- D3 -->
      <path d="M200,456 L248,484 L200,512 L152,484 Z" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
      <text x="200" y="488" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist','Noto Sans KR',sans-serif" text-anchor="middle">성공?</text>

      <!-- ④ -->
      <rect x="80" y="528" width="240" height="56" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
      <text x="200" y="552" fill="#f5f5f5" font-size="14" font-weight="600" font-family="'Geist','Noto Sans KR',sans-serif" text-anchor="middle">④ 기본 데이터 생성</text>
      <text x="200" y="572" fill="#bfc0c0" font-size="12" font-family="'Noto Sans KR',sans-serif" text-anchor="middle">기존 슬롯 전부 백업 후</text>

      <!-- ONLOAD -->
      <rect x="860" y="280" width="280" height="120" rx="20" fill="rgba(240,138,89,0.12)" stroke="#f08a59" stroke-width="1"/>
      <text x="1000" y="328" fill="#f5f5f5" font-size="16" font-weight="600" font-family="'Geist','Noto Sans KR',sans-serif" text-anchor="middle">진행 데이터 연결</text>
      <text x="1000" y="356" fill="#bfc0c0" font-size="12" font-family="'Geist Mono',monospace" text-anchor="middle">ONLOAD</text>

      <circle cx="860" cy="300" r="4" fill="#bfc0c0"/>
      <circle cx="860" cy="330" r="4" fill="#bfc0c0"/>
      <circle cx="860" cy="360" r="4" fill="#bfc0c0"/>
      <circle cx="860" cy="390" r="4" fill="#bfc0c0"/>

      <line x1="40" y1="632" x2="1240" y2="632" stroke="rgba(245,245,245,0.10)" stroke-width="0.8"/>
      <text x="40" y="656" fill="#bfc0c0" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">LEGEND</text>
      <rect x="120" y="644" width="24" height="12" rx="6" fill="rgba(240,138,89,0.12)" stroke="#f08a59"/>
      <text x="152" y="656" fill="#bfc0c0" font-size="8" font-family="'Geist Mono',monospace">START / MERGE</text>
      <path d="M300,650 L312,656 L300,662 L288,656 Z" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
      <text x="328" y="656" fill="#bfc0c0" font-size="8" font-family="'Geist Mono',monospace">DECISION</text>
      <rect x="440" y="644" width="16" height="12" rx="2" fill="rgba(240,138,89,0.12)" stroke="#f08a59"/>
      <text x="464" y="656" fill="#bfc0c0" font-size="8" font-family="'Geist Mono',monospace">FOCAL STEP</text>
    </svg>
  </main>
</body>
</html>
