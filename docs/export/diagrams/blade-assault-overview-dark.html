<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>블레이드 어썰트 — 담당 시스템 구조</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 48px 32px; background: #2d3142; color: #f5f5f5; font-family: 'Geist', 'Noto Sans KR', system-ui, sans-serif; }
    .frame { width: 100%; max-width: 1280px; }
    .eyebrow { margin-bottom: 8px; color: #bfc0c0; font: 500 8px 'Geist Mono', monospace; letter-spacing: 0.14em; text-transform: uppercase; }
    h1 { margin-bottom: 24px; font: 400 40px/1.15 'Instrument Serif', serif; }
    svg { display: block; width: 100%; }
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">Architecture · Blade Assault · slide-16x9</p>
    <h1>담당 시스템 구조</h1>
    <svg viewBox="0 0 1280 720" role="img" aria-labelledby="blade-assault-overview-dark-title blade-assault-overview-dark-desc" xmlns="http://www.w3.org/2000/svg">
      <title id="blade-assault-overview-dark-title">블레이드 어썰트 담당 시스템 구조</title>
      <desc id="blade-assault-overview-dark-desc">런 빌드, 액션 파이프라인, 스테이지 루프, 적 AI, 메타, 세이브가 어떻게 나뉘는지 보여 주는 프로젝트 전체 구조도입니다.</desc>
      <defs>
        <marker id="ba-ov-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker>
        <marker id="ba-ov-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker>
      </defs>
      <rect width="1280" height="720" fill="#2d3142"/>

      <rect x="40" y="120" width="1200" height="320" rx="8" fill="none" stroke="rgba(245,245,245,0.16)"/>
      <text x="56" y="148" fill="#bfc0c0" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">RUN · ACTION · STAGE</text>

      <!-- Connectors: runtime spine + action→enemy AI. Meta/Save separated by layout only. -->
      <path d="M296,240 H344" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#ba-ov-arrow)"/>
      <path d="M576,240 H624" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#ba-ov-arrow)"/>
      <path d="M460,288 V352" fill="none" stroke="#bfc0c0" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#ba-ov-arrow)"/>

      <!-- Runtime row -->
      <rect x="80" y="192" width="216" height="96" rx="6" fill="#2d3142"/>
      <rect x="80" y="192" width="216" height="96" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
      <text x="188" y="224" fill="#f5f5f5" font-size="16" font-weight="600" font-family="'Geist','Noto Sans KR',sans-serif" text-anchor="middle">런 빌드</text>
      <text x="188" y="248" fill="#bfc0c0" font-size="12" font-family="'Noto Sans KR',sans-serif" text-anchor="middle">코어 · 기어 · 개조 · 리스크</text>

      <rect x="344" y="192" width="232" height="96" rx="6" fill="#2d3142"/>
      <rect x="344" y="192" width="232" height="96" rx="6" fill="rgba(240,138,89,0.12)" stroke="#f08a59" stroke-width="1"/>
      <text x="460" y="224" fill="#f5f5f5" font-size="16" font-weight="600" font-family="'Geist','Noto Sans KR',sans-serif" text-anchor="middle">액션 파이프라인</text>
      <text x="460" y="248" fill="#bfc0c0" font-size="12" font-family="'Noto Sans KR',sans-serif" text-anchor="middle">의도 · 게이트 · 무기 히트마크</text>

      <rect x="624" y="192" width="216" height="96" rx="6" fill="#2d3142"/>
      <rect x="624" y="192" width="216" height="96" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
      <text x="732" y="224" fill="#f5f5f5" font-size="16" font-weight="600" font-family="'Geist','Noto Sans KR',sans-serif" text-anchor="middle">스테이지 루프</text>
      <text x="732" y="248" fill="#bfc0c0" font-size="12" font-family="'Noto Sans KR',sans-serif" text-anchor="middle">방 · 미션 · 진행</text>

      <rect x="344" y="352" width="232" height="72" rx="6" fill="#2d3142"/>
      <rect x="344" y="352" width="232" height="72" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
      <text x="460" y="384" fill="#f5f5f5" font-size="16" font-weight="600" font-family="'Geist','Noto Sans KR',sans-serif" text-anchor="middle">적 AI</text>
      <text x="460" y="404" fill="#bfc0c0" font-size="12" font-family="'Geist Mono',monospace" text-anchor="middle">BT → 같은 명령 척추</text>

      <!-- Cross-cutting -->
      <rect x="80" y="480" width="200" height="80" rx="6" fill="#2d3142"/>
      <rect x="80" y="480" width="200" height="80" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
      <text x="180" y="512" fill="#f5f5f5" font-size="16" font-weight="600" font-family="'Geist','Noto Sans KR',sans-serif" text-anchor="middle">메타</text>
      <text x="180" y="532" fill="#bfc0c0" font-size="12" font-family="'Noto Sans KR',sans-serif" text-anchor="middle">특성 · 부활</text>

      <rect x="920" y="480" width="200" height="80" rx="6" fill="#2d3142"/>
      <rect x="920" y="480" width="200" height="80" rx="6" fill="rgba(245,245,245,0.03)" stroke="rgba(245,245,245,0.30)" stroke-width="1" stroke-dasharray="4,4"/>
      <text x="1020" y="512" fill="#f5f5f5" font-size="16" font-weight="600" font-family="'Geist','Noto Sans KR',sans-serif" text-anchor="middle">세이브</text>
      <text x="1020" y="532" fill="#bfc0c0" font-size="12" font-family="'Noto Sans KR',sans-serif" text-anchor="middle">프로필 · 슬롯 · 백업</text>

      <line x1="40" y1="632" x2="1240" y2="632" stroke="rgba(245,245,245,0.10)" stroke-width="0.8"/>
      <text x="40" y="656" fill="#bfc0c0" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">LEGEND</text>
      <rect x="128" y="644" width="16" height="12" rx="2" fill="rgba(240,138,89,0.12)" stroke="#f08a59"/>
      <text x="152" y="656" fill="#bfc0c0" font-size="8" font-family="'Geist Mono',monospace">FOCAL</text>
      <line x1="248" y1="650" x2="280" y2="650" stroke="#bfc0c0" stroke-width="1.2" stroke-dasharray="5,4"/>
      <text x="292" y="656" fill="#bfc0c0" font-size="8" font-family="'Geist Mono',monospace">CROSS-CUT</text>
    </svg>
  </main>
</body>
</html>
