<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>드래곤 이즈 데드 — 전투 읽기 지도</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 32px;
      background: #2d3142;
      color: #f5f5f5;
      font-family: 'Geist', 'Noto Sans KR', system-ui, sans-serif;
    }
    .frame { width: 100%; max-width: 1280px; }
    .eyebrow {
      margin-bottom: 8px;
      color: #bfc0c0;
      font: 500 8px 'Geist Mono', monospace;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
    h1 {
      margin-bottom: 24px;
      font: 400 40px/1.15 'Instrument Serif', 'Noto Serif KR', serif;
    }
    svg { display: block; width: 100%; }
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">Flowchart · Dragon Is Dead · slide-16x9</p>
    <h1>전투 읽기 지도</h1>
    <svg viewBox="0 0 1280 720" role="img" aria-labelledby="dragon-combat-cluster-map-dark-title dragon-combat-cluster-map-dark-desc" xmlns="http://www.w3.org/2000/svg">
      <title id="dragon-combat-cluster-map-dark-title">드래곤 이즈 데드 전투 읽기 지도</title>
      <desc id="dragon-combat-cluster-map-dark-desc">들어가며에서 타격·데미지 줄기와 트리거·연쇄 줄기로 읽기 순서가 이어지고, 점선은 fixed-data 참조를 가리킵니다.</desc>
      <defs>
        <marker id="dg-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker>
        <marker id="dg-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker>
      </defs>
      <rect width="1280" height="720" fill="#2d3142"/>

      <!-- Connectors -->
      <path d="M208,320 H280" fill="none" stroke="#f08a59" stroke-width="1.4" marker-end="url(#dg-arrow-accent)"/>
      <path d="M560,320 H640" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#dg-arrow)"/>
      <path d="M136,368 V456 A8,8 0 0 0 144,464 H280" fill="none" stroke="#bfc0c0" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#dg-arrow)"/>

      <!-- Nodes -->
      <rect x="48" y="284" width="160" height="72" rx="6" fill="#2d3142"/>
      <rect x="48" y="284" width="160" height="72" rx="6" fill="rgba(240,138,89,0.12)" stroke="#f08a59" stroke-width="1"/>
      <text x="128" y="316" fill="#f5f5f5" font-size="16" font-weight="600" font-family="'Geist','Noto Sans KR',sans-serif" text-anchor="middle">들어가며</text>
      <text x="128" y="336" fill="#bfc0c0" font-size="12" font-family="'Geist Mono',monospace" text-anchor="middle">이 글</text>

      <rect x="280" y="268" width="280" height="104" rx="6" fill="#2d3142"/>
      <rect x="280" y="268" width="280" height="104" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
      <text x="420" y="300" fill="#f5f5f5" font-size="16" font-weight="600" font-family="'Geist','Noto Sans KR',sans-serif" text-anchor="middle">타격 · 데미지</text>
      <text x="420" y="324" fill="#bfc0c0" font-size="12" font-family="'Geist','Noto Sans KR',sans-serif" text-anchor="middle">캐릭터 → 능력치 → 공격 → 투사체</text>

      <rect x="640" y="268" width="280" height="104" rx="6" fill="#2d3142"/>
      <rect x="640" y="268" width="280" height="104" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
      <text x="780" y="300" fill="#f5f5f5" font-size="16" font-weight="600" font-family="'Geist','Noto Sans KR',sans-serif" text-anchor="middle">트리거 · 연쇄</text>
      <text x="780" y="324" fill="#bfc0c0" font-size="12" font-family="'Geist','Noto Sans KR',sans-serif" text-anchor="middle">적용 → 버프 → 패시브 → 한 타격</text>

      <rect x="280" y="448" width="200" height="72" rx="6" fill="#2d3142"/>
      <rect x="280" y="448" width="200" height="72" rx="6" fill="rgba(245,245,245,0.03)" stroke="rgba(245,245,245,0.30)" stroke-width="1" stroke-dasharray="4,4"/>
      <text x="380" y="480" fill="#f5f5f5" font-size="16" font-weight="600" font-family="'Geist Mono',monospace" text-anchor="middle">fixed-data</text>
      <text x="380" y="500" fill="#bfc0c0" font-size="12" font-family="'Geist Mono',monospace" text-anchor="middle">필요할 때</text>

      <line x1="40" y1="632" x2="1240" y2="632" stroke="rgba(245,245,245,0.10)" stroke-width="0.8"/>
      <text x="40" y="656" fill="#bfc0c0" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">LEGEND</text>
      <rect x="128" y="644" width="16" height="12" rx="2" fill="rgba(240,138,89,0.12)" stroke="#f08a59"/>
      <text x="152" y="656" fill="#bfc0c0" font-size="8" font-family="'Geist Mono',monospace">ENTRY</text>
      <line x1="248" y1="650" x2="280" y2="650" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#dg-arrow)"/>
      <text x="292" y="656" fill="#bfc0c0" font-size="8" font-family="'Geist Mono',monospace">SPINE</text>
      <line x1="368" y1="650" x2="400" y2="650" stroke="#bfc0c0" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#dg-arrow)"/>
      <text x="412" y="656" fill="#bfc0c0" font-size="8" font-family="'Geist Mono',monospace">REFERENCE</text>
    </svg>
  </main>
</body>
</html>
