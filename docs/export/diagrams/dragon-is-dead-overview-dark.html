<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>드래곤 이즈 데드 — 담당 시스템 구조</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 48px 32px; background: #2d3142; color: #f5f5f5; font-family: 'Geist', 'Noto Sans KR', system-ui, sans-serif; }
    .frame { width: 100%; max-width: 1280px; }
    .eyebrow { margin-bottom: 8px; color: #bfc0c0; font: 500 8px 'Geist Mono', monospace; letter-spacing: 0.14em; text-transform: uppercase; }
    h1 { margin-bottom: 24px; font: 400 40px/1.15 'Instrument Serif', serif; }
    svg { display: block; width: 100%; }
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">Architecture · Dragon Is Dead · slide-16x9</p>
    <h1>담당 시스템 구조</h1>
    <svg viewBox="0 0 1280 720" role="img" aria-labelledby="dragon-is-dead-overview-dark-title dragon-is-dead-overview-dark-desc" xmlns="http://www.w3.org/2000/svg">
      <title id="dragon-is-dead-overview-dark-title">드래곤 이즈 데드 담당 시스템 구조</title>
      <desc id="dragon-is-dead-overview-dark-desc">게임플레이·전투, 성장·빌드, 월드·연출, 출시·운영, 성능 다섯 축으로 나뉜 프로젝트 전체 구조도입니다.</desc>
      <defs>
        <marker id="dg-ov-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker>
      </defs>
      <rect width="1280" height="720" fill="#2d3142"/>

      <!-- Connectors: focal→world (aligned), growth→world→release, middle→performance fan-in -->
      <path d="M640,248 V320" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#dg-ov-arrow)"/>
      <path d="M460,360 H500" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#dg-ov-arrow)"/>
      <path d="M780,360 H820" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#dg-ov-arrow)"/>
      <path d="M320,416 V448" fill="none" stroke="#bfc0c0" stroke-width="1.2" stroke-dasharray="5,4"/>
      <path d="M640,416 V448" fill="none" stroke="#bfc0c0" stroke-width="1.2" stroke-dasharray="5,4"/>
      <path d="M960,416 V448" fill="none" stroke="#bfc0c0" stroke-width="1.2" stroke-dasharray="5,4"/>
      <path d="M320,448 H960" fill="none" stroke="#bfc0c0" stroke-width="1.2" stroke-dasharray="5,4"/>
      <path d="M640,448 V480" fill="none" stroke="#bfc0c0" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#dg-ov-arrow)"/>

      <!-- Focal top -->
      <rect x="280" y="136" width="720" height="112" rx="6" fill="#2d3142"/>
      <rect x="280" y="136" width="720" height="112" rx="6" fill="rgba(240,138,89,0.12)" stroke="#f08a59" stroke-width="1"/>
      <text x="640" y="176" fill="#f5f5f5" font-size="16" font-weight="600" font-family="'Geist','Noto Sans KR',sans-serif" text-anchor="middle">게임플레이 · 전투</text>
      <text x="640" y="200" fill="#bfc0c0" font-size="12" font-family="'Noto Sans KR',sans-serif" text-anchor="middle">타격·데미지 · 트리거·연쇄 · 입력 · 스킬 · 연출</text>
      <text x="640" y="220" fill="#bfc0c0" font-size="12" font-family="'Noto Sans KR',sans-serif" text-anchor="middle">적 AI · 스테이지</text>

      <!-- Second row (world centered under focal @ x=640) -->
      <rect x="180" y="320" width="280" height="96" rx="6" fill="#2d3142"/>
      <rect x="180" y="320" width="280" height="96" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
      <text x="320" y="352" fill="#f5f5f5" font-size="16" font-weight="600" font-family="'Geist','Noto Sans KR',sans-serif" text-anchor="middle">성장 · 빌드</text>
      <text x="320" y="376" fill="#bfc0c0" font-size="12" font-family="'Noto Sans KR',sans-serif" text-anchor="middle">인벤토리 · 유물 · 스킬 성장</text>

      <rect x="500" y="320" width="280" height="96" rx="6" fill="#2d3142"/>
      <rect x="500" y="320" width="280" height="96" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
      <text x="640" y="352" fill="#f5f5f5" font-size="16" font-weight="600" font-family="'Geist','Noto Sans KR',sans-serif" text-anchor="middle">월드 · 연출</text>
      <text x="640" y="376" fill="#bfc0c0" font-size="12" font-family="'Noto Sans KR',sans-serif" text-anchor="middle">카메라 · UI · 설정</text>

      <rect x="820" y="320" width="280" height="96" rx="6" fill="#2d3142"/>
      <rect x="820" y="320" width="280" height="96" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
      <text x="960" y="352" fill="#f5f5f5" font-size="16" font-weight="600" font-family="'Geist','Noto Sans KR',sans-serif" text-anchor="middle">출시 · 운영</text>
      <text x="960" y="376" fill="#bfc0c0" font-size="12" font-family="'Noto Sans KR',sans-serif" text-anchor="middle">세이브 · 데이터 · Steam · 분석</text>

      <!-- Performance footer -->
      <rect x="400" y="480" width="480" height="72" rx="6" fill="#2d3142"/>
      <rect x="400" y="480" width="480" height="72" rx="6" fill="rgba(245,245,245,0.03)" stroke="rgba(245,245,245,0.30)" stroke-width="1" stroke-dasharray="4,4"/>
      <text x="640" y="512" fill="#f5f5f5" font-size="16" font-weight="600" font-family="'Geist','Noto Sans KR',sans-serif" text-anchor="middle">성능</text>
      <text x="640" y="532" fill="#bfc0c0" font-size="12" font-family="'Noto Sans KR',sans-serif" text-anchor="middle">로그 · 선스폰 · GPU · TMP</text>

      <line x1="40" y1="632" x2="1240" y2="632" stroke="rgba(245,245,245,0.10)" stroke-width="0.8"/>
      <text x="40" y="656" fill="#bfc0c0" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">LEGEND</text>
      <rect x="128" y="644" width="16" height="12" rx="2" fill="rgba(240,138,89,0.12)" stroke="#f08a59"/>
      <text x="152" y="656" fill="#bfc0c0" font-size="8" font-family="'Geist Mono',monospace">FOCAL</text>
      <line x1="248" y1="650" x2="280" y2="650" stroke="#bfc0c0" stroke-width="1.2" stroke-dasharray="5,4"/>
      <text x="292" y="656" fill="#bfc0c0" font-size="8" font-family="'Geist Mono',monospace">CROSS-CUT</text>
    </svg>
  </main>
</body>
</html>
