<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>세이브 레이아웃 — 메인 · 사이드 · 메타</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 48px 32px; background: #2d3142; color: #f5f5f5; font-family: 'Geist', 'Noto Sans KR', system-ui, sans-serif; }
    .frame { width: 100%; max-width: 1280px; }
    .eyebrow { margin-bottom: 8px; color: #bfc0c0; font: 500 8px 'Geist Mono', monospace; letter-spacing: 0.14em; text-transform: uppercase; }
    h1 { margin-bottom: 24px; font: 400 40px/1.15 'Instrument Serif', serif; }
    svg { display: block; width: 100%; }
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">Nested · Save Layout · slide-16x9</p>
    <h1>메인 · 사이드 · 메타</h1>
    <svg viewBox="0 0 1280 720" role="img" aria-labelledby="save-lanes-title save-lanes-desc" xmlns="http://www.w3.org/2000/svg">
      <title id="save-lanes-title">세이브 레이아웃 메인·사이드·메타 레인</title>
      <desc id="save-lanes-desc">persistentDataPath 아래 메타가 선택 슬롯을 두고, 메인 Profile과 선택적 사이드가 나뉩니다. 점선은 Profile에서 사이드로의 참조입니다.</desc>
      <defs>
        <marker id="sl-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker>
        <marker id="sl-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker>
      </defs>
      <rect width="1280" height="720" fill="#2d3142"/>

      <!-- Outer: persistentDataPath -->
      <rect x="80" y="88" width="1120" height="480" rx="8" fill="rgba(245,245,245,0.02)" stroke="rgba(245,245,245,0.28)" stroke-width="1"/>
      <rect x="96" y="80" width="200" height="18" fill="#2d3142"/>
      <text x="104" y="94" fill="#bfc0c0" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">PERSISTENTDATAPATH</text>

      <!-- Meta zone -->
      <rect x="120" y="128" width="1040" height="100" rx="8" fill="rgba(245,245,245,0.03)" stroke="rgba(191,192,192,0.45)" stroke-width="1"/>
      <rect x="136" y="120" width="56" height="18" fill="#2d3142"/>
      <text x="144" y="134" fill="#bfc0c0" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">메타</text>
      <rect x="160" y="152" width="320" height="56" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
      <text x="320" y="178" fill="#f5f5f5" font-size="16" font-weight="600" font-family="'Geist','Noto Sans KR',sans-serif" text-anchor="middle">선택 슬롯 · 시퀀스</text>
      <text x="320" y="196" fill="#bfc0c0" font-size="12" font-family="'Geist Mono',monospace" text-anchor="middle">Meta</text>

      <!-- Connectors: Meta → Main (solid), Main → Side (dashed) -->
      <path d="M320,208 V248" fill="none" stroke="#f08a59" stroke-width="1.4" marker-end="url(#sl-arrow-accent)"/>
      <path d="M640,360 H720" fill="none" stroke="#bfc0c0" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#sl-arrow)"/>

      <!-- Main zone (focal) -->
      <rect x="120" y="256" width="500" height="248" rx="8" fill="rgba(240,138,89,0.06)" stroke="#f08a59" stroke-width="1"/>
      <rect x="136" y="248" width="72" height="18" fill="#2d3142"/>
      <text x="144" y="262" fill="#f08a59" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">메인 — 영구</text>
      <rect x="180" y="300" width="380" height="96" rx="6" fill="rgba(240,138,89,0.12)" stroke="#f08a59" stroke-width="1"/>
      <text x="370" y="340" fill="#f5f5f5" font-size="16" font-weight="600" font-family="'Geist','Noto Sans KR',sans-serif" text-anchor="middle">Profile N</text>
      <text x="370" y="364" fill="#bfc0c0" font-size="12" font-family="'Noto Sans KR',sans-serif" text-anchor="middle">슬롯당 영구 진행 · 쿨다운</text>
      <text x="370" y="456" fill="#8e98ac" font-size="12" font-family="'Noto Sans KR',sans-serif" text-anchor="middle">허브 정본 = 메타 + Profile</text>

      <!-- Side zone -->
      <rect x="660" y="256" width="500" height="248" rx="8" fill="rgba(245,245,245,0.03)" stroke="rgba(245,245,245,0.30)" stroke-width="1"/>
      <rect x="676" y="248" width="88" height="18" fill="#2d3142"/>
      <text x="684" y="262" fill="#bfc0c0" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">사이드 — 선택</text>
      <rect x="720" y="300" width="380" height="96" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
      <text x="910" y="340" fill="#f5f5f5" font-size="16" font-weight="600" font-family="'Geist','Noto Sans KR',sans-serif" text-anchor="middle">세션 · 오토 스냅샷</text>
      <text x="910" y="364" fill="#bfc0c0" font-size="12" font-family="'Noto Sans KR',sans-serif" text-anchor="middle">옆 레인 · valid 힌트</text>
      <text x="910" y="456" fill="#8e98ac" font-size="12" font-family="'Noto Sans KR',sans-serif" text-anchor="middle">허브 정본에는 포함하지 않음</text>

      <line x1="40" y1="632" x2="1240" y2="632" stroke="rgba(245,245,245,0.10)" stroke-width="0.8"/>
      <text x="40" y="656" fill="#bfc0c0" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">LEGEND</text>
      <rect x="128" y="644" width="16" height="12" rx="2" fill="rgba(240,138,89,0.12)" stroke="#f08a59"/>
      <text x="152" y="656" fill="#bfc0c0" font-size="8" font-family="'Geist Mono',monospace">FOCAL MAIN</text>
      <line x1="280" y1="650" x2="312" y2="650" stroke="#f08a59" stroke-width="1.4" marker-end="url(#sl-arrow-accent)"/>
      <text x="324" y="656" fill="#bfc0c0" font-size="8" font-family="'Geist Mono',monospace">HUB</text>
      <line x1="400" y1="650" x2="432" y2="650" stroke="#bfc0c0" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#sl-arrow)"/>
      <text x="444" y="656" fill="#bfc0c0" font-size="8" font-family="'Geist Mono',monospace">OPTIONAL SIDE</text>
    </svg>
  </main>
</body>
</html>
