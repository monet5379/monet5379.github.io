title: 유승현
description: 채용 · 포트폴리오 · 공개 기술
url: "https://monet5379.github.io"
baseurl: ""
timezone: Asia/Seoul

author: 유승현
email: monet5379@gmail.com
github_username: monet5379

markdown: kramdown
theme: minima

exclude:
  - docs
  - AGENTS.md
  - vendor
  - README.md

plugins:
  - jekyll-feed
  - jekyll-seo-tag

header_pages:
  - index.md
  - projects/index.md
  - notes/index.md
  - reviews/index.md

# /notes/ 공개 분류. 여기 없는 tags는 비공개.
# production 목록에는 공개만 빌드. 로컬 serve는 전 글 + 비공개 토글(기본 숨김).
notes_production_visible_tags:
  - 전투
  - 스킬
  - 인벤
  - 성장
  - 세이브
  - 데이터
  - 폰트
  - 최적화
  - 내러티브
